<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #term { position: absolute; inset: 0; padding: 6px 0 0 8px; background: var(--bg, rgba(12,12,12,0.96)); }
  .xterm .xterm-viewport { background: transparent !important; }
  .xterm .xterm-screen canvas { background: transparent !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-web-links.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const port = q.get('port');
  const token = q.get('token');
  const dark = q.get('theme') !== 'light';

  const schemes = {
    Campbell: {
      background: '#0c0c0c', foreground: '#cccccc', cursor: '#ffffff', selectionBackground: '#ffffff40',
      black: '#0c0c0c', red: '#c50f1f', green: '#13a10e', yellow: '#c19c00', blue: '#0037da',
      magenta: '#881798', cyan: '#3a96dd', white: '#cccccc', brightBlack: '#767676', brightRed: '#e74856',
      brightGreen: '#16c60c', brightYellow: '#f9f1a5', brightBlue: '#3b78ff', brightMagenta: '#b4009e',
      brightCyan: '#61d6d6', brightWhite: '#f2f2f2',
    },
    'One Half Dark': {
      background: '#282c34', foreground: '#dcdfe4', cursor: '#dcdfe4', selectionBackground: '#ffffff40',
      black: '#282c34', red: '#e06c75', green: '#98c379', yellow: '#e5c07b', blue: '#61afef',
      magenta: '#c678dd', cyan: '#56b6c2', white: '#dcdfe4', brightBlack: '#5a6374', brightRed: '#e06c75',
      brightGreen: '#98c379', brightYellow: '#e5c07b', brightBlue: '#61afef', brightMagenta: '#c678dd',
      brightCyan: '#56b6c2', brightWhite: '#dcdfe4',
    },
  };

  const themes = {
    dark: {
      background: '#1d1e21', foreground: '#e8e9eb', cursor: '#e8e9eb', selectionBackground: '#3a3d45',
      black: '#1d1e21', red: '#f2555a', green: '#5bc46b', yellow: '#e5b84f', blue: '#5c9cf5',
      magenta: '#c678dd', cyan: '#56b6c2', white: '#d0d2d6', brightBlack: '#6b6f78', brightRed: '#ff7b80',
      brightGreen: '#7ed88b', brightYellow: '#f0cd6f', brightBlue: '#7fb3ff', brightMagenta: '#d89bf0',
      brightCyan: '#79d0db', brightWhite: '#ffffff',
    },
    light: {
      background: '#ffffff', foreground: '#1a1c1f', cursor: '#1a1c1f', selectionBackground: '#cfd6e2',
      black: '#1a1c1f', red: '#c62828', green: '#2e7d32', yellow: '#9a6b00', blue: '#1e5bc6',
      magenta: '#8e24aa', cyan: '#00838f', white: '#5f6368', brightBlack: '#80868b', brightRed: '#e53935',
      brightGreen: '#43a047', brightYellow: '#c28a00', brightBlue: '#3b7be0', brightMagenta: '#ab47bc',
      brightCyan: '#00acc1', brightWhite: '#1a1c1f',
    },
  };
  schemes.Deck = themes.dark;
  schemes['Deck Light'] = themes.light;

  function lookFrom(src) {
    return {
      font: src.font || 'CaskaydiaCove NF',
      size: Number(src.size) || 12,
      lineHeight: 1.2,
      opacity: Math.max(0, Math.min(100, Number(src.opacity ?? 96))),
      scheme: src.scheme || 'Campbell',
    };
  }
  function hexToRgba(hex, alpha) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h.slice(0, 6), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }
  function applyLook(look, isDark) {
    const base = schemes[look.scheme] || (isDark ? themes.dark : themes.light);
    // xterm paints its own background per cell; keep it fully transparent and let #term carry the
    // tinted, translucent surface so the window behind shows through at the chosen opacity.
    term.options.theme = Object.assign({}, base, { background: '#00000000' });
    term.options.fontFamily = `"${look.font}", "Cascadia Code", "Cascadia Mono", Consolas, monospace`;
    term.options.fontSize = Math.round(look.size * 96 / 72);
    term.options.lineHeight = look.lineHeight;
    document.documentElement.style.setProperty('--bg', hexToRgba(base.background, look.opacity / 100));
    fit.fit();
  }

  const initialLook = lookFrom({ font: q.get('font'), size: q.get('size'), opacity: q.get('opacity'), scheme: q.get('scheme') });
  const initialBase = schemes[initialLook.scheme] || (dark ? themes.dark : themes.light);
  document.documentElement.style.setProperty('--bg', hexToRgba(initialBase.background, initialLook.opacity / 100));

  const term = new Terminal({
    theme: Object.assign({}, initialBase, { background: '#00000000' }),
    fontFamily: `"${initialLook.font}", "Cascadia Code", "Cascadia Mono", Consolas, monospace`,
    fontSize: Math.round(initialLook.size * 96 / 72),
    lineHeight: initialLook.lineHeight,
    scrollback: 20000,
    cursorBlink: false,
    cursorStyle: 'bar',
    cursorInactiveStyle: 'none',
    allowProposedApi: true,
    allowTransparency: true,
    linkHandler: { activate: (_e, uri) => post({ type: 'open', uri }) },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = '11';
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => post({ type: 'open', uri })));
  term.open(document.getElementById('term'));
  fit.fit();

  function post(msg) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
  }

  let ws = null;
  let seq = 0;
  let ended = false;
  let retries = 0;

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  term.onData(data => send({ type: 'input', data }));
  term.onResize(({ cols, rows }) => send({ type: 'resize', cols, rows }));
  term.onTitleChange(title => post({ type: 'title', title }));

  function connect() {
    if (ended) return;
    const sock = new WebSocket(`ws://127.0.0.1:${port}/attach?token=${encodeURIComponent(token)}&after=${seq}`);
    sock.binaryType = 'arraybuffer';
    ws = sock;
    let expectSnapshot = false;
    let snapStart = 0;
    const openedAt = { at: 0 };
    sock.onopen = () => {
      openedAt.at = Date.now();
      const { cols, rows } = term;
      sock.send(JSON.stringify({ type: 'resize', cols, rows }));
      post({ type: 'connected' });
    };
    sock.onmessage = ev => {
      if (typeof ev.data === 'string') {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'snapshot') {
          expectSnapshot = msg.end > msg.start;
          snapStart = msg.start;
          if (seq === 0 || msg.start !== seq) term.reset();
          seq = expectSnapshot ? msg.start : msg.end;
          if (msg.title) post({ type: 'title', title: msg.title });
        } else if (msg.type === 'exit') {
          ended = true;
          term.write(`\r\n\x1b[90m[process exited with code ${msg.code}]\x1b[0m\r\n`);
          post({ type: 'exit', code: msg.code });
        } else if (msg.type === 'title') {
          post({ type: 'title', title: msg.title });
        }
        return;
      }
      const bytes = new Uint8Array(ev.data);
      if (expectSnapshot) { expectSnapshot = false; seq = snapStart; }
      seq += bytes.length;
      term.write(bytes);
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null;
      if (ended) return;
      if (openedAt.at && Date.now() - openedAt.at > 15000) retries = 0;
      const delay = Math.min(30000, 500 * Math.pow(2, Math.min(retries++, 6)));
      post({ type: 'disconnected', retryMs: delay });
      setTimeout(connect, delay);
    };
    sock.onerror = () => {};
  }

  const ro = new ResizeObserver(() => fit.fit());
  ro.observe(document.getElementById('term'));
  window.addEventListener('focus', () => term.focus());

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', ev => {
      const m = ev.data;
      if (!m || !m.type) return;
      if (m.type === 'focus') term.focus();
      else if (m.type === 'fit') fit.fit();
      else if (m.type === 'kill') send({ type: 'kill' });
      else if (m.type === 'theme') {
        applyLook(lookFrom(m.look || {}), !!m.dark);
      }
    });
  }

  connect();
  term.focus();
})();
</script>
</body>
</html>
