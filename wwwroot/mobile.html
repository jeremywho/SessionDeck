<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" id="viewport" content="width=device-width, initial-scale=1">
<title>session</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0c0c0c; }
  body { -webkit-text-size-adjust: 100%; }
  #term { padding: 6px; display: inline-block; }
  #term.selecting { touch-action: none; }
  .xterm .xterm-viewport { scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
  #banner { position: fixed; left: 0; right: 0; top: 0; padding: 4px 10px; font: 12px -apple-system, system-ui, sans-serif; color: #f9f1a5; background: #3a2a00; display: none; }
  #banner.shown { display: block; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-unicode11.js"></script>
<script src="mobile.js"></script>
</body>
</html>
