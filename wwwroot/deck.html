<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  /* xterm keeps a native scrollbar on the viewport under its own fading overlay slider; only the overlay should show. */
  .xterm .xterm-viewport { scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
  /* xterm sizes the overlay slider inline at 10 px; Windows Terminal's is a 6 px rounded thumb on a bare track. */
  .xterm .xterm-scrollable-element > .scrollbar.vertical { width: 10px !important; }
  .xterm .xterm-scrollable-element > .scrollbar.vertical > .slider { width: 6px !important; left: 2px !important; border-radius: 3px; }
  .pane { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; box-sizing: border-box; background: var(--bg, rgba(12,12,12,0.96)); visibility: hidden; }
  /* The inset lives on xterm's own element: the fit addon subtracts that element's padding when it
     counts rows, but not the parent's, so padding on .pane gave one row too many and clipped the last. */
  .pane .xterm { padding: 6px 0 0 8px; }
  .pane.shown { visibility: visible; }
  .divider { position: absolute; top: 0; bottom: 0; width: 7px; margin-left: -3px; cursor: col-resize; z-index: 5; }
    .divider::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--fg3, #8a8d93); opacity: 0.45; }
  .divider:hover::after, body.dragging .divider::after { opacity: 0.9; }
  body.dragging .pane { pointer-events: none; }
  #dropzone { position: absolute; top: 0; bottom: 0; display: none; pointer-events: none; z-index: 6;
              background: rgba(79, 155, 240, 0.16); border: 1px solid rgba(79, 155, 240, 0.7); border-radius: 4px; }
  #dropzone.shown { display: block; }
  body.dragging { cursor: col-resize; user-select: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
           font: 13px "Segoe UI Variable", "Segoe UI", sans-serif; color: var(--fg3, #8a8d93); opacity: 0.7; line-height: 1.6;
           user-select: none; }
  #empty.hidden { display: none; }
  .xterm .xterm-viewport { background: transparent !important; }
  .xterm .xterm-screen canvas { background: transparent !important; }
</style>
</head>
<body>
<div id="dropzone"></div>
<div id="empty">No session open.<br>Click a hosted row on the left, or start one with the buttons.<br><br>Ctrl+Tab cycles tabs · Ctrl+W closes · drag tabs to reorder</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-web-links.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  let dark = q.get('theme') !== 'light';

  const schemes = {
    Campbell: {
      background: '#0c0c0c', foreground: '#cccccc', cursor: '#ffffff', selectionBackground: '#ffffff40',
      black: '#0c0c0c', red: '#c50f1f', green: '#13a10e', yellow: '#c19c00', blue: '#0037da',
      magenta: '#881798', cyan: '#3a96dd', white: '#cccccc', brightBlack: '#767676', brightRed: '#e74856',
      brightGreen: '#16c60c', brightYellow: '#f9f1a5', brightBlue: '#3b78ff', brightMagenta: '#b4009e',
      brightCyan: '#61d6d6', brightWhite: '#f2f2f2',
    },
    'One Half Dark': {
      background: '#282c34', foreground: '#dcdfe4', cursor: '#dcdfe4', selectionBackground: '#ffffff40',
      black: '#282c34', red: '#e06c75', green: '#98c379', yellow: '#e5c07b', blue: '#61afef',
      magenta: '#c678dd', cyan: '#56b6c2', white: '#dcdfe4', brightBlack: '#5a6374', brightRed: '#e06c75',
      brightGreen: '#98c379', brightYellow: '#e5c07b', brightBlue: '#61afef', brightMagenta: '#c678dd',
      brightCyan: '#56b6c2', brightWhite: '#dcdfe4',
    },
  };

  const themes = {
    dark: {
      background: '#1d1e21', foreground: '#e8e9eb', cursor: '#e8e9eb', selectionBackground: '#3a3d45',
      black: '#1d1e21', red: '#f2555a', green: '#5bc46b', yellow: '#e5b84f', blue: '#5c9cf5',
      magenta: '#c678dd', cyan: '#56b6c2', white: '#d0d2d6', brightBlack: '#6b6f78', brightRed: '#ff7b80',
      brightGreen: '#7ed88b', brightYellow: '#f0cd6f', brightBlue: '#7fb3ff', brightMagenta: '#d89bf0',
      brightCyan: '#79d0db', brightWhite: '#ffffff',
    },
    light: {
      background: '#ffffff', foreground: '#1a1c1f', cursor: '#1a1c1f', selectionBackground: '#cfd6e2',
      black: '#1a1c1f', red: '#c62828', green: '#2e7d32', yellow: '#9a6b00', blue: '#1e5bc6',
      magenta: '#8e24aa', cyan: '#00838f', white: '#5f6368', brightBlack: '#80868b', brightRed: '#e53935',
      brightGreen: '#43a047', brightYellow: '#c28a00', brightBlue: '#3b7be0', brightMagenta: '#ab47bc',
      brightCyan: '#00acc1', brightWhite: '#1a1c1f',
    },
  };
  schemes.Deck = themes.dark;
  schemes['Deck Light'] = themes.light;

  function lookFrom(src) {
    return {
      font: src.font || 'CaskaydiaCove NF',
      size: Number(src.size) || 12,
      lineHeight: 1.0,
      opacity: Math.max(0, Math.min(100, Number(src.opacity ?? 96))),
      scheme: src.scheme || 'Campbell',
    };
  }
  function hexToRgba(hex, alpha) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h.slice(0, 6), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  let look = lookFrom({ font: q.get('font'), size: q.get('size'), opacity: q.get('opacity'), scheme: q.get('scheme') });
  const baseOf = () => schemes[look.scheme] || (dark ? themes.dark : themes.light);
  function sliderColours() {
    const ink = dark ? '255, 255, 255' : '0, 0, 0';
    return {
      scrollbarSliderBackground: `rgba(${ink}, 0.22)`,
      scrollbarSliderHoverBackground: `rgba(${ink}, 0.34)`,
      scrollbarSliderActiveBackground: `rgba(${ink}, 0.46)`,
    };
  }
  function setSurface() {
    document.documentElement.style.setProperty('--bg', hexToRgba(baseOf().background, look.opacity / 100));
    document.documentElement.style.setProperty('--fg3', dark ? '#8a8d93' : '#6b6f78');
  }
  setSurface();

  function post(msg) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
  }

  // xterm paints its own background per cell; keep it fully transparent and let the pane carry the
  // tinted, translucent surface so the window behind shows through at the chosen opacity.
  function termOptions() {
    return {
      theme: Object.assign({}, baseOf(), { background: '#00000000' }, sliderColours()),
      fontFamily: `"${look.font}", "Cascadia Code", "Cascadia Mono", Consolas, monospace`,
      fontSize: Math.round(look.size * 96 / 72),
      lineHeight: look.lineHeight,
      scrollback: 20000,
      cursorBlink: false,
      cursorStyle: 'bar',
      cursorInactiveStyle: 'none',
      allowProposedApi: true,
      allowTransparency: true,
      linkHandler: { activate: (_e, uri) => post({ type: 'open', uri }) },
    };
  }

  const ESC = String.fromCharCode(27), CR = String.fromCharCode(13), DEL = String.fromCharCode(127);
  const panes = new Map();
  const empty = document.getElementById('empty');
  // Columns ("groups") as the app lays them out: each shows one terminal by id, or none, and has a
  // share of the width. The dividers between them are draggable; the app is told the new shares.
  let groups = [];
  let focused = 0;
  const dividers = [];

  function send(p, obj) {
    if (p.ws && p.ws.readyState === WebSocket.OPEN) p.ws.send(JSON.stringify(obj));
  }

  function open(id, port, token) {
    if (panes.has(id)) return;
    const el = document.createElement('div');
    el.className = 'pane';
    document.body.appendChild(el);
    const term = new Terminal(termOptions());
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new Unicode11Addon.Unicode11Addon());
    term.unicode.activeVersion = '11';
    term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => post({ type: 'open', uri })));
    term.open(el);
    fit.fit();
    const p = { id, port, token, el, term, fit, ws: null, seq: 0, ended: false, retries: 0, ro: null };
    panes.set(id, p);
    term.onData(data => send(p, { type: 'input', data }));
    term.textarea.addEventListener('focus', () => {
      const gi = groups.findIndex(g => g.id === id);
      if (gi >= 0 && gi !== focused) { focused = gi; layout(); }
      post({ type: 'focused', id });
    });
    // Windows Terminal (via Claude Code's terminal setup) sends ESC CR for Shift+Enter, which both
    // CLIs take as "newline, don't submit", and ESC DEL for Ctrl+Backspace (delete word); xterm
    // would send a bare CR and a bare DEL. Ctrl+Enter gets the same as Shift+Enter.
    // Clipboard keys as Windows Terminal has them. xterm would otherwise send Ctrl+V and Ctrl+C
    // to the CLI as control characters. The app reads and writes the Windows clipboard; Alt+V is
    // passed through as ESC v, which Claude Code takes as "read the image on the clipboard".
    const key = ev => (ev.key || '').toLowerCase();
    const isPaste = ev => (ev.ctrlKey && !ev.altKey && key(ev) === 'v') || (ev.shiftKey && !ev.ctrlKey && ev.key === 'Insert');
    const isCopy = ev => (ev.ctrlKey && !ev.altKey && key(ev) === 'c' && (ev.shiftKey || term.hasSelection()))
      || (ev.ctrlKey && !ev.shiftKey && ev.key === 'Insert');
    term.attachCustomKeyEventHandler(ev => {
      if (isPaste(ev)) {
        if (ev.type === 'keydown') post({ type: 'paste', id });
        ev.preventDefault();
        return false;
      }
      if (isCopy(ev)) {
        if (ev.type === 'keydown' && term.hasSelection()) { post({ type: 'copy', text: term.getSelection() }); term.clearSelection(); }
        ev.preventDefault();
        return false;
      }
      if (ev.altKey && !ev.ctrlKey && key(ev) === 'v') {
        if (ev.type === 'keydown') send(p, { type: 'input', data: ESC + 'v' });
        ev.preventDefault();
        return false;
      }
      const chord = ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey) && !ev.altKey ? ESC + CR
        : ev.key === 'Backspace' && ev.ctrlKey && !ev.altKey ? ESC + DEL
        : null;
      if (chord === null) return true;
      if (ev.type === 'keydown') send(p, { type: 'input', data: chord });
      ev.preventDefault();
      return false;
    });
    // Right-click: copy the selection if there is one, otherwise paste, as in Windows Terminal.
    el.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if (term.hasSelection()) { post({ type: 'copy', text: term.getSelection() }); term.clearSelection(); }
      else post({ type: 'paste', id });
    });
    term.onResize(({ cols, rows }) => send(p, { type: 'resize', cols, rows }));
    term.onTitleChange(title => post({ type: 'title', id, title }));
    p.ro = new ResizeObserver(() => { fit.fit(); reportMetrics(p); });
    p.ro.observe(el);
    connect(p);
  }

  function connect(p) {
    if (p.ended) return;
    const sock = new WebSocket(`ws://127.0.0.1:${p.port}/attach?token=${encodeURIComponent(p.token)}&after=${p.seq}`);
    sock.binaryType = 'arraybuffer';
    p.ws = sock;
    let expectSnapshot = false;
    let snapStart = 0;
    let openedAt = 0;
    sock.onopen = () => {
      openedAt = Date.now();
      const { cols, rows } = p.term;
      sock.send(JSON.stringify({ type: 'resize', cols, rows }));
      post({ type: 'connected', id: p.id });
    };
    sock.onmessage = ev => {
      if (typeof ev.data === 'string') {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'snapshot') {
          expectSnapshot = msg.end > msg.start;
          snapStart = msg.start;
          if (p.seq === 0 || msg.start !== p.seq) p.term.reset();
          p.seq = expectSnapshot ? msg.start : msg.end;
          if (msg.title) post({ type: 'title', id: p.id, title: msg.title });
        } else if (msg.type === 'exit') {
          p.ended = true;
          p.term.write(`\r\n\x1b[90m[process exited with code ${msg.code}]\x1b[0m\r\n`);
          post({ type: 'exit', id: p.id, code: msg.code });
        } else if (msg.type === 'title') {
          post({ type: 'title', id: p.id, title: msg.title });
        }
        return;
      }
      const bytes = new Uint8Array(ev.data);
      if (expectSnapshot) { expectSnapshot = false; p.seq = snapStart; }
      p.seq += bytes.length;
      p.term.write(bytes);
    };
    sock.onclose = () => {
      if (p.ws !== sock) return;
      p.ws = null;
      if (p.ended) return;
      if (openedAt && Date.now() - openedAt > 15000) p.retries = 0;
      const delay = Math.min(30000, 500 * Math.pow(2, Math.min(p.retries++, 6)));
      post({ type: 'disconnected', id: p.id, retryMs: delay });
      setTimeout(() => connect(p), delay);
    };
    sock.onerror = () => {};
  }

  function layout() {
    const n = groups.length;
    const total = groups.reduce((a, g) => a + g.frac, 0) || 1;
    while (dividers.length < Math.max(0, n - 1)) dividers.push(makeDivider(dividers.length));
    while (dividers.length > Math.max(0, n - 1)) dividers.pop().remove();
    const shownIds = new Set(groups.map(g => g.id).filter(Boolean));
    for (const [k, v] of panes) v.el.classList.toggle('shown', shownIds.has(k));
    let x = 0;
    for (let i = 0; i < n; i++) {
      const w = groups[i].frac / total * 100;
      const p = groups[i].id ? panes.get(groups[i].id) : null;
      if (p) {
        p.el.style.left = i === 0 ? '0' : `calc(${x}% + 1px)`;
        p.el.style.width = `calc(${w}% - ${(i === 0 ? 0 : 1) + (i === n - 1 ? 0 : 1)}px)`;
        p.fit.fit();
      }
      x += w;
      if (i < n - 1) dividers[i].style.left = `${x}%`;
    }
    empty.classList.toggle('hidden', shownIds.size > 0);
    const f = groups[focused] && groups[focused].id ? panes.get(groups[focused].id) : null;
    document.title = f ? `terminal port=${f.port}` : 'terminal';
  }

  function focusGroup(i) {
    if (i < 0 || i >= groups.length) return;
    focused = i;
    const p = groups[i].id ? panes.get(groups[i].id) : null;
    if (p) p.term.focus();
  }

  function makeDivider(i) {
    const d = document.createElement('div');
    d.className = 'divider';
    document.body.appendChild(d);
    d.addEventListener('mousedown', ev => {
      ev.preventDefault();
      document.body.classList.add('dragging');
      const total = groups.reduce((a, g) => a + g.frac, 0) || 1;
      const leftStart = groups.slice(0, i).reduce((a, g) => a + g.frac, 0) / total;
      const pair = (groups[i].frac + groups[i + 1].frac) / total;
      let pending = false;
      const move = e => {
        const pos = e.clientX / document.body.clientWidth;
        const a = Math.max(0.15 * pair, Math.min(0.85 * pair, pos - leftStart));
        groups[i].frac = a * total;
        groups[i + 1].frac = (pair - a) * total;
        if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; layout(); }); }
      };
      const up = () => {
        document.body.classList.remove('dragging');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        layout();
        post({ type: 'fractions', id: groups[i].id || groups[i + 1].id || '', fracs: groups.map(g => g.frac) });
        focusGroup(focused);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    return d;
  }

  function close(id) {
    const p = panes.get(id);
    if (!p) return;
    p.ended = true;
    try { if (p.ws) p.ws.close(); } catch {}
    p.ro.disconnect();
    p.term.dispose();
    p.el.remove();
    panes.delete(id);
    for (const g of groups) if (g.id === id) g.id = null;
    layout();
  }

  function applyLook() {
    setSurface();
    const o = termOptions();
    for (const p of panes.values()) {
      p.term.options.theme = o.theme;
      p.term.options.fontFamily = o.fontFamily;
      p.term.options.fontSize = o.fontSize;
      p.term.options.lineHeight = o.lineHeight;
      p.fit.fit();
    }
  }

  // A tab dragged out of a strip: the app puts "sessiondeck-tab:<host id>" in the drag's text, and
  // Chromium hands the drag to the page. Near a column's left or right edge the drop opens a new
  // column on that side, like VS Code; in the middle it moves the tab into that column.
  const dropzone = document.getElementById('dropzone');
  const TAB_PREFIX = 'sessiondeck-tab:';

  function dropTarget(clientX) {
    const width = document.body.clientWidth || 1;
    if (groups.length === 0) return { group: 0, side: 'center', left: 0, right: width };
    const total = groups.reduce((a, g) => a + g.frac, 0) || 1;
    let x = 0;
    for (let i = 0; i < groups.length; i++) {
      const w = groups[i].frac / total * width;
      if (clientX <= x + w || i === groups.length - 1) {
        const edge = Math.min(w * 0.25, 160);
        if (clientX < x + edge) return { group: i, side: 'left', left: x, right: x + edge };
        if (clientX > x + w - edge) return { group: i, side: 'right', left: x + w - edge, right: x + w };
        return { group: i, side: 'center', left: x, right: x + w };
      }
      x += w;
    }
    return { group: groups.length - 1, side: 'center', left: 0, right: width };
  }

  function isTabDrag(ev) {
    return ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('text/plain');
  }

  document.addEventListener('dragover', ev => {
    if (!isTabDrag(ev)) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    const t = dropTarget(ev.clientX);
    dropzone.style.left = `${t.left}px`;
    dropzone.style.width = `${Math.max(0, t.right - t.left)}px`;
    dropzone.classList.add('shown');
  });
  document.addEventListener('dragleave', ev => {
    if (ev.relatedTarget === null || ev.clientX <= 0 || ev.clientY <= 0) dropzone.classList.remove('shown');
  });
  document.addEventListener('drop', ev => {
    dropzone.classList.remove('shown');
    if (!isTabDrag(ev)) return;
    ev.preventDefault();
    const text = ev.dataTransfer.getData('text/plain') || '';
    if (!text.startsWith(TAB_PREFIX)) return;
    const t = dropTarget(ev.clientX);
    post({ type: 'dropTab', id: text.slice(TAB_PREFIX.length), group: t.group, side: t.side });
  });

  // After a resize settles, tell the app what the terminal thinks its geometry is, so a mismatch
  // between rows and the space they get can be read from the performance log.
  let metricsTimer = null;
  function reportMetrics(p) {
    clearTimeout(metricsTimer);
    metricsTimer = setTimeout(() => {
      const core = p.term._core;
      const cell = core && core._renderService ? core._renderService.dimensions.css.cell : { width: 0, height: 0 };
      const screen = p.el.querySelector('.xterm-screen');
      post({ type: 'metrics', id: p.id, cols: p.term.cols, rows: p.term.rows,
             elW: p.el.clientWidth, elH: p.el.clientHeight,
             cellW: Math.round(cell.width * 100) / 100, cellH: Math.round(cell.height * 100) / 100,
             screenH: screen ? screen.clientHeight : 0, dpr: window.devicePixelRatio,
             viewportY: p.term.buffer.active.viewportY, baseY: p.term.buffer.active.baseY });
    }, 600);
  }

  function focusShown() {
    focusGroup(focused);
  }

  window.addEventListener('focus', focusShown);

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', ev => {
      const m = ev.data;
      if (!m || !m.type) return;
      switch (m.type) {
        case 'open': open(m.id, m.port, m.token); break;
        case 'layout':
          groups = m.groups.map(g => ({ id: g.id || null, frac: Number(g.frac) || 1 }));
          focused = Math.min(m.focused ?? focused, Math.max(0, groups.length - 1));
          layout();
          break;
        case 'close': close(m.id); break;
        case 'focus': focusShown(); break;
        case 'paste': {
          // No text on the clipboard: hand the CLI the bare Ctrl+V so Codex (and Claude on other
          // platforms) can read an image from the clipboard themselves.
          const p = panes.get(m.id);
          if (!p) break;
          if (m.text) p.term.paste(m.text); else send(p, { type: 'input', data: String.fromCharCode(22) });
          break;
        }
        case 'fit': for (const p of panes.values()) p.fit.fit(); break;
        case 'kill': { const p = panes.get(m.id); if (p) send(p, { type: 'kill' }); break; }
        case 'theme': dark = !!m.dark; look = lookFrom(m.look || {}); applyLook(); break;
      }
    });
  }

  post({ type: 'ready' });
})();
</script>
</body>
</html>
